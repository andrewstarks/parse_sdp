name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm test
      - run: docker compose run --rm test lua spec/check_coverage.lua

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v4
      - run: |
          luarocks install lpeg
          luarocks install dkjson
          luarocks install argparse
          luarocks install busted
      - run: luarocks make ./parse_sdp-1.10.0-1.rockspec
      # The installed rock must load on its own: run from outside the
      # checkout so ./?.lua cannot shadow a module the rockspec forgot.
      - run: cd / && lua -e 'local sdp = require("parse_sdp"); assert(sdp.parse("v=0\r\no=- 1 1 IN IP4 192.0.2.1\r\ns=x\r\nt=0 0\r\n"))'
      - run: busted spec/

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm test busted spec_conformance/
